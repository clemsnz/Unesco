<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Overlap — Carte « C'est calé » (A6)</title>
<link rel="stylesheet" href="../css/brand.css">
<style>
 @page{size:148mm 105mm;margin:0}
 body{width:559px;height:397px;overflow:hidden;background:var(--blue);color:#fff;padding:26px 30px;position:relative}
 .t{font:800 44px var(--title);display:flex;align-items:center;gap:14px}
 .t .tick{width:40px;height:40px}
 .t .tick::after{left:14px;top:7px;width:10px;height:19px;border-width:0 5px 5px 0}
 .row{display:flex;gap:10px;align-items:flex-end;margin-top:24px;font:700 18px var(--text)}
 .row .l{flex:1;border-bottom:2px solid rgba(255,255,255,.8);height:24px}
 .note{position:absolute;left:30px;right:30px;bottom:22px;display:flex;align-items:center;gap:12px;font:600 12.5px/1.3 var(--text)}
 .note img{width:44px;height:44px;border-radius:11px;border:2px solid #fff;flex:none}
</style></head>
<body>
 <div class="t">C'est calé <span class="tick"></span></div>
 <div class="row">Groupe <span class="l"></span></div>
 <div class="row">Le <span class="l"></span> à <span class="l" style="flex:.5"></span></div>
 <div class="row">Où <span class="l"></span></div>
 <div class="row">On était <span class="l" style="flex:.25"></span> sur <span class="l" style="flex:.25"></span> à dire oui</div>
 <div class="note"><img src="../img/logo_icon.png"><span><b>Prends-la en photo et envoie-la au groupe.</b><br>Inscrits au pilote : rappel la veille + check-in le lendemain. Less chatting – More meeting.</span></div>
</body></html>
